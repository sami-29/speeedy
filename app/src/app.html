<!doctype html>
<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- On the landing page only, hooks.server.ts puts the 1.x hash route mapper here
		     (src/lib/legacy). It must stay before every other script so it runs before analytics. -->
		<!--speeedy-legacy-hash-->
		<meta name="theme-color" content="#eff1f1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/icons/favicon-32.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="preload" href="%sveltekit.assets%/fonts/archivo-wdth.woff2" as="font" type="font/woff2" crossorigin />
		<!-- Applies the saved Night theme before first paint on app routes. The landing and
		     other public pages are always Paper. Keep the route list in step with src/lib/routes.ts. -->
		<script>
			try {
				if (
					localStorage.getItem("speeedy.theme") === "night" &&
					/^(\/[a-z]{2})?\/(reader|library|stats|training|s|account)(\/|$)/.test(location.pathname)
				) {
					document.documentElement.dataset.theme = "night";
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
