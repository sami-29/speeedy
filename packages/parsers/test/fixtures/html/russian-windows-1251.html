<h1>Утро</h1>
<p>Над рекой поднимался туман, и вся деревня ещё спала. Только старый рыбак уже сидел у воды и чинил сеть.</p>
<p>«Сегодня будет хороший улов», — сказал он тихо, ни к кому не обращаясь.</p>
