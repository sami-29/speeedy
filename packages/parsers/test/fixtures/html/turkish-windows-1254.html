<h1>Bahçedeki Çocuk</h1>
<p>Çocuk bahçede ıslak çimenlerin üzerinde koşuyordu. Güneş yeni doğmuştu ve her şey ışıl ışıldı.</p>
<p>Şiirleri ve öyküleri çok severdi; <em>ğ</em>, <strong>ü</strong>, ö, ç, ş, İ ve ı harflerini birlikte öğrenmişti.</p>
