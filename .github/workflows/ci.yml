name: CI

on:
  push:
    branches: [main, "2.0"]
  pull_request:
    branches: [main, "2.0"]

# pnpm/action-setup reads the version from `packageManager` in package.json.
# Node 22.22 is the floor: posthog-node, wrangler and pnpm 11+ all need it or newer.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Kokoro model, voice and lexicon are never committed. They are fetched once per
      # pinned set (keyed on assets.ts) so the golden and real-model tests run in CI.
      - uses: actions/cache@v4
        with:
          path: packages/kokoro/.cache
          key: kokoro-assets-${{ hashFiles('packages/kokoro/src/assets.ts') }}
      - run: pnpm --filter @speeedy/kokoro fetch:assets
      - run: pnpm test:unit

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @speeedy/worker typecheck
      - run: pnpm test:worker

  # Playwright e2e and the axe smoke test run against the built static app (`app/e2e`).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @speeedy/app exec playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: packages/kokoro/.cache
          key: kokoro-assets-${{ hashFiles('packages/kokoro/src/assets.ts') }}
      - run: pnpm --filter @speeedy/kokoro fetch:assets
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/test-results
